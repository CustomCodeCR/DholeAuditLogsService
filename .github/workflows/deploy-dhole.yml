name: Deploy Dhole AuditLogs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dhole-auditlogs-deploy
  cancel-in-progress: true

env:
  COMPOSE_FILE: .dhole-system/deploy/docker-compose.services.yml

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CustomCodeCR/DholeSystem
          ref: main
          path: .dhole-system
      - name: Verify server
        run: |
          set -euo pipefail
          docker version
          docker compose version
          docker network inspect dhole >/dev/null
          test -f /opt/dhole/.env
          docker compose --env-file /opt/dhole/.env -f "$COMPOSE_FILE" config -q
      - name: Build images
        run: |
          set -euo pipefail
          SHA_TAG="${GITHUB_SHA::12}"
          docker build --pull -f src/Dhole.AuditLogs.Api/Dockerfile -t dhole/auditlogs-api:latest -t "dhole/auditlogs-api:$SHA_TAG" .
          docker build --pull -f src/Dhole.AuditLogs.Workers/Dockerfile -t dhole/auditlogs-workers:latest -t "dhole/auditlogs-workers:$SHA_TAG" .
      - name: Deploy AuditLogs
        run: |
          set -euo pipefail
          docker compose --env-file /opt/dhole/.env -f "$COMPOSE_FILE" up -d --no-deps --force-recreate --pull never auditlogs-api auditlogs-workers
          docker compose --env-file /opt/dhole/.env -f "$COMPOSE_FILE" ps auditlogs-api auditlogs-workers
      - name: Cleanup old images
        run: docker image prune -f
